apiVersion: v1
kind: ConfigMap
metadata:
  name: calendar-config
data:
  calendar_config.yaml: |
    calendar:
      logger:
        level: {{ .Values.configs.calendar.logLevel | default "DEBUG" }}
      server:
        type: {{ .Values.configs.calendar.server.type | default "http" }}
        host: {{ .Values.configs.calendar.server.host | default "0.0.0.0" }}
        port: {{ .Values.configs.calendar.server.port | default "8888" }}
        timeOut: {{ .Values.configs.calendar.server.timeOut | default 30 }}
      storage:
        type: "postgres"
        dsn: "postgres://{{ .Values.configs.postgres.user }}:{{ .Values.configs.postgres.password }}@{{ .Values.configs.postgres.host }}:5432/{{ .Values.configs.postgres.database }}?sslmode=disable"
