apiVersion: batch/v1
kind: Job
metadata:
  name: goose-migration
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: goose
        image: {{ .Values.registry }}/{{ .Values.migrations.image }}
        imagePullPolicy: "IfNotPresent"
        env:
        - name: GOOSE_DRIVER
          value: {{ .Values.migrations.driver }}
        - name: GOOSE_MIGRATION_DIR
          value: {{ .Values.migrations.dir }}
        - name: GOOSE_DBSTRING
          value: {{ .Values.migrations.dbstring | quote }}
        command:
          - sh
          - -c
          - |
            for i in $(seq 1 30); do
              echo "Attempt $i: Running migrations..."
              if goose up; then
                echo "Migrations successful!"
                exit 0
              fi
              echo "Database not ready, waiting 2s..."
              sleep 2
            done
            echo "Failed after 30 attempts"
            exit 1
  backoffLimit: 3
